
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f3f4f6;
            color: #1f2937;
            margin: 0;
            padding: 30px 15px;
            transition: background 0.3s, color 0.3s;
        }

        .container {
            max-width: 750px;
            margin: auto;
            padding: 25px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        h1 {
            text-align: center;
            color: #2563eb;
            margin-top: 0;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            margin-bottom: 25px;
        }

        .theme-row {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 15px;
        }

        button, input, select {
            font: inherit;
        }

        button {
            cursor: pointer;
            border: none;
            border-radius: 8px;
            padding: 11px 14px;
        }

        button:hover {
            opacity: 0.85;
        }

        .dark-button {
            background: #374151;
            color: white;
        }

        .task-form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        .task-form input,
        .task-form select {
            width: 100%;
            min-width: 0;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            background: white;
            color: #111827;
        }

        #taskInput,
        #addTaskButton {
            grid-column: 1 / -1;
        }

        #addTaskButton {
            background: #2563eb;
            color: white;
            font-weight: bold;
        }

        /* Search box */

        .search-section {
            margin-bottom: 15px;
        }

        #searchInput {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
            background: white;
            color: #1f2937;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        #searchInput:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        .filter-section {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 20px;
        }

        .filter-button {
            background: #e5e7eb;
            color: #1f2937;
        }

        .filter-button.active {
            background: #2563eb;
            color: white;
        }

        #taskList {
            list-style: none;
            padding: 0;
            margin: 0 0 20px;
        }

        .task-item {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
            padding: 15px;
            margin-bottom: 12px;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            overflow-wrap: anywhere;
        }

        .task-main {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            flex: 1;
            min-width: 0;
        }

        .task-checkbox {
            width: 18px;
            height: 18px;
            margin-top: 3px;
            cursor: pointer;
            flex-shrink: 0;
        }

        .task-details {
            flex: 1;
            min-width: 0;
        }

        .task-name {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        .task-item.completed .task-name {
            text-decoration: line-through;
            opacity: 0.55;
        }

        .task-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
            font-size: 12px;
            color: #6b7280;
        }

        .priority,
        .due-label {
            display: inline-block;
            padding: 4px 7px;
            border-radius: 5px;
            background: #f3f4f6;
        }

        .priority.High {
            color: #b91c1c;
            background: #fee2e2;
        }

        .priority.Medium {
            color: #92400e;
            background: #fef3c7;
        }

        .priority.Low {
            color: #166534;
            background: #dcfce7;
        }

        .task-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .task-actions button {
            padding: 7px 9px;
            font-size: 12px;
            color: white;
        }

        .edit-button {
            background: #7c3aed;
        }

        .delete-button {
            background: #dc2626;
        }

        /* Progress bar */

        .progress-section {
            width: 100%;
            margin: 20px 0;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 8px;
        }

        #progressText {
            font-size: 14px;
            color: #2563eb;
            font-weight: bold;
        }

        .progress-track {
            width: 100%;
            height: 14px;
            background: #e5e7eb;
            border-radius: 20px;
            overflow: hidden;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: #22c55e;
            border-radius: 20px;
            transition: width 0.4s ease;
        }

        #clearAllButton {
            width: 100%;
            background: #dc2626;
            color: white;
            font-weight: bold;
        }

        .empty-message {
            text-align: center;
            color: #6b7280;
            padding: 20px 5px;
        }

        /* Dark mode */

        body.dark-mode {
            background: #111827;
            color: #f9fafb;
        }

        body.dark-mode .container {
            background: #1f2937;
        }

        body.dark-mode .subtitle,
        body.dark-mode .task-meta {
            color: #d1d5db;
        }

        body.dark-mode .task-item {
            border-color: #374151;
        }

        body.dark-mode .task-form input,
        body.dark-mode .task-form select,
        body.dark-mode #searchInput {
            background: #374151;
            color: white;
            border-color: #4b5563;
        }

        body.dark-mode #searchInput::placeholder {
            color: #d1d5db;
        }

        body.dark-mode .filter-button {
            background: #374151;
            color: white;
        }

        body.dark-mode .filter-button.active {
            background: #2563eb;
            color: white;
        }

        body.dark-mode .progress-track {
            background: #374151;
        }

        body.dark-mode #progressText {
            color: #60a5fa;
        }

        body.dark-mode .priority,
        body.dark-mode .due-label {
            background: #374151;
        }

        @media (max-width: 520px) {
            body {
                padding: 15px 8px;
            }

            .container {
                padding: 16px;
            }

            .task-item {
                flex-direction: column;
            }

            .task-actions {
                margin-left: 28px;
            }

            .filter-button {
                flex: 1 1 auto;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>My To-Do List</h1>
        <p class="subtitle">Organize your day, one task at a time.</p>

        <div class="theme-row">
            <button id="darkModeButton" class="dark-button" type="button">
                🌙 Dark Mode
            </button>
        </div>

        <form id="taskForm" class="task-form">
            <input
                type="text"
                id="taskInput"
                placeholder="Enter a new task..."
                maxlength="250"
                required
            >

            <select id="priorityInput" aria-label="Task priority">
                <option value="Medium">Medium Priority</option>
                <option value="High">High Priority</option>
                <option value="Low">Low Priority</option>
            </select>

            <input
                type="date"
                id="dueDateInput"
                aria-label="Task due date"
            >

            <button id="addTaskButton" type="submit">Add Task</button>
        </form>

        <div class="search-section">
            <input
                type="text"
                id="searchInput"
                placeholder="🔍 Search your tasks..."
                aria-label="Search your tasks"
            >
        </div>

        <div class="filter-section">
            <button class="filter-button active" data-filter="all" type="button">
                All Tasks
            </button>
            <button class="filter-button" data-filter="today" type="button">
                Today
            </button>
            <button class="filter-button" data-filter="upcoming" type="button">
                Upcoming
            </button>
            <button class="filter-button" data-filter="overdue" type="button">
                Overdue
            </button>
            <button class="filter-button" data-filter="completed" type="button">
                Completed
            </button>
        </div>

        <div class="summary">
            <ul id="taskList"></ul>

            <div class="progress-section">
                <div class="progress-info">
                    <strong id="taskCount">Tasks: 0 | Completed: 0</strong>
                    <span id="progressText">0% completed</span>
                </div>

                <div
                    class="progress-track"
                    id="progressTrack"
                    role="progressbar"
                    aria-label="Task completion progress"
                    aria-valuemin="0"
                    aria-valuemax="100"
                    aria-valuenow="0"
                >
                    <div id="progressBar" class="progress-bar"></div>
                </div>
            </div>

            <button id="clearAllButton" type="button">
                Clear All Tasks
            </button>
        </div>
    </div>

    <script>
        const taskForm = document.getElementById("taskForm");
        const taskInput = document.getElementById("taskInput");
        const searchInput = document.getElementById("searchInput");
        const priorityInput = document.getElementById("priorityInput");
        const dueDateInput = document.getElementById("dueDateInput");
        const taskList = document.getElementById("taskList");
        const taskCount = document.getElementById("taskCount");
        const progressText = document.getElementById("progressText");
        const progressBar = document.getElementById("progressBar");
        const progressTrack = document.getElementById("progressTrack");
        const clearAllButton = document.getElementById("clearAllButton");
        const darkModeButton = document.getElementById("darkModeButton");
        const filterButtons = document.querySelectorAll(".filter-button");

        let currentFilter = "all";
        let darkMode = localStorage.getItem("darkMode") === "true";

        // Load saved tasks.
        function loadTasks() {
            try {
                const savedTasks = JSON.parse(localStorage.getItem("tasks"));

                if (!Array.isArray(savedTasks)) {
                    return [];
                }

                return savedTasks.map((task, index) => {
                    if (typeof task === "string") {
                        return {
                            id: Date.now() + index,
                            text: task,
                            completed: false,
                            priority: "Medium",
                            dueDate: ""
                        };
                    }

                    return {
                        id: task.id ?? Date.now() + index,
                        text: task.text ?? task.name ?? "",
                        completed: Boolean(task.completed),
                        priority: ["High", "Medium", "Low"].includes(task.priority)
                            ? task.priority
                            : "Medium",
                        dueDate: task.dueDate ?? ""
                    };
                });
            } catch (error) {
                return [];
            }
        }

        let tasks = loadTasks();

        function saveTasks() {
            localStorage.setItem("tasks", JSON.stringify(tasks));
        }

        function getToday() {
            const today = new Date();
            const year = today.getFullYear();
            const month = String(today.getMonth() + 1).padStart(2, "0");
            const day = String(today.getDate()).padStart(2, "0");

            return `${year}-${month}-${day}`;
        }

        function formatDate(dateString) {
            if (!dateString) return "";

            const parts = dateString.split("-");
            return `${parts[2]}/${parts[1]}/${parts[0]}`;
        }

        function getVisibleTasks() {
            const today = getToday();
            const searchTerm = searchInput.value.trim().toLowerCase();

            return tasks.filter(task => {
                const matchesSearch = task.text
                    .toLowerCase()
                    .includes(searchTerm);

                if (!matchesSearch) {
                    return false;
                }

                if (currentFilter === "completed") {
                    return task.completed;
                }

                if (currentFilter === "today") {
                    return !task.completed && task.dueDate === today;
                }

                if (currentFilter === "upcoming") {
                    return !task.completed &&
                        task.dueDate !== "" &&
                        task.dueDate > today;
                }

                if (currentFilter === "overdue") {
                    return !task.completed &&
                        task.dueDate !== "" &&
                        task.dueDate < today;
                }

                return true;
            });
        }

        function renderTasks() {
            taskList.innerHTML = "";

            const visibleTasks = getVisibleTasks();

            if (visibleTasks.length === 0) {
                const emptyMessage = document.createElement("li");
                emptyMessage.className = "empty-message";
                emptyMessage.textContent = tasks.length === 0
                    ? "No tasks yet. Add your first task above!"
                    : "No matching tasks found.";
                taskList.appendChild(emptyMessage);
            }

            visibleTasks.forEach(task => {
                const item = document.createElement("li");
                item.className = "task-item";

                if (task.completed) {
                    item.classList.add("completed");
                }

                const main = document.createElement("div");
                main.className = "task-main";

                const checkbox = document.createElement("input");
                checkbox.type = "checkbox";
                checkbox.className = "task-checkbox";
                checkbox.checked = task.completed;
                checkbox.setAttribute("aria-label", "Mark task completed");

                checkbox.addEventListener("change", () => {
                    task.completed = checkbox.checked;
                    saveTasks();
                    renderTasks();
                });

                const details = document.createElement("div");
                details.className = "task-details";

                const taskName = document.createElement("span");
                taskName.className = "task-name";
                taskName.textContent = task.text;

                const meta = document.createElement("div");
                meta.className = "task-meta";

                const priority = document.createElement("span");
                priority.className = "priority " + task.priority;
                priority.textContent = task.priority + " Priority";
                meta.appendChild(priority);

                if (task.dueDate) {
                    const dueLabel = document.createElement("span");
                    dueLabel.className = "due-label";
                    dueLabel.textContent = "Due: " + formatDate(task.dueDate);

                    if (!task.completed && task.dueDate < getToday()) {
                        dueLabel.textContent += " (Overdue)";
                        dueLabel.style.color = "#dc2626";
                    }

                    meta.appendChild(dueLabel);
                }

                details.appendChild(taskName);
                details.appendChild(meta);
                main.appendChild(checkbox);
                main.appendChild(details);

                const actions = document.createElement("div");
                actions.className = "task-actions";

                const editButton = document.createElement("button");
                editButton.type = "button";
                editButton.className = "edit-button";
                editButton.textContent = "Edit";

                editButton.addEventListener("click", () => {
                    const newText = prompt("Edit your task:", task.text);

                    if (newText === null) return;

                    if (newText.trim() === "") {
                        alert("Task cannot be empty.");
                        return;
                    }

                    task.text = newText.trim();

                    const newPriority = prompt(
                        "Priority: High, Medium, or Low",
                        task.priority
                    );

                    if (newPriority !== null) {
                        const normalizedPriority = newPriority.trim().toLowerCase();

                        if (["high", "medium", "low"].includes(normalizedPriority)) {
                            task.priority =
                                normalizedPriority.charAt(0).toUpperCase() +
                                normalizedPriority.slice(1);
                        }
                    }

                    const newDueDate = prompt(
                        "Due date in YYYY-MM-DD format, or leave blank:",
                        task.dueDate
                    );

                    if (newDueDate !== null) {
                        const dateValue = newDueDate.trim();

                        if (dateValue === "" || /^\d{4}-\d{2}-\d{2}$/.test(dateValue)) {
                            task.dueDate = dateValue;
                        } else {
                            alert("Date unchanged. Use YYYY-MM-DD format.");
                        }
                    }

                    saveTasks();
                    renderTasks();
                });

                const deleteButton = document.createElement("button");
                deleteButton.type = "button";
                deleteButton.className = "delete-button";
                deleteButton.textContent = "Delete";

                deleteButton.addEventListener("click", () => {
                    if (confirm("Delete this task?")) {
                        tasks = tasks.filter(item => item.id !== task.id);
                        saveTasks();
                        renderTasks();
                    }
                });

                actions.appendChild(editButton);
                actions.appendChild(deleteButton);
                item.appendChild(main);
                item.appendChild(actions);
                taskList.appendChild(item);
            });

            // Update the overall task progress.
            const completedTasks = tasks.filter(task => task.completed).length;

            const percentage = tasks.length === 0
                ? 0
                : Math.round((completedTasks / tasks.length) * 100);

            taskCount.textContent =
                "Tasks: " + tasks.length +
                " | Completed: " + completedTasks;

            progressText.textContent = percentage + "% completed";
            progressBar.style.width = percentage + "%";
            progressTrack.setAttribute("aria-valuenow", percentage);
        }

        // Add a task.
        taskForm.addEventListener("submit", event => {
            event.preventDefault();

            const text = taskInput.value.trim();

            if (text === "") {
                alert("Please enter a task.");
                return;
            }

            tasks.push({
                id: Date.now(),
                text: text,
                completed: false,
                priority: priorityInput.value,
                dueDate: dueDateInput.value
            });

            saveTasks();
            taskForm.reset();
            priorityInput.value = "Medium";
            renderTasks();
            taskInput.focus();
        });

        // Search tasks as you type.
        searchInput.addEventListener("input", renderTasks);

        // Filter tasks.
        filterButtons.forEach(button => {
            button.addEventListener("click", () => {
                currentFilter = button.dataset.filter;

                filterButtons.forEach(filterButton => {
                    filterButton.classList.remove("active");
                });

                button.classList.add("active");
                renderTasks();
            });
        });

        // Clear all tasks.
        clearAllButton.addEventListener("click", () => {
            if (tasks.length === 0) {
                alert("There are no tasks to clear.");
                return;
            }

            if (confirm("Are you sure you want to delete all tasks?")) {
                tasks = [];
                saveTasks();
                renderTasks();
            }
        });

        // Dark mode.
        function applyDarkMode() {
            document.body.classList.toggle("dark-mode", darkMode);

            darkModeButton.textContent = darkMode
                ? "☀️ Light Mode"
                : "🌙 Dark Mode";
        }

        darkModeButton.addEventListener("click", () => {
            darkMode = !darkMode;
            localStorage.setItem("darkMode", String(darkMode));
            applyDarkMode();
        });

        // Start the app.
        applyDarkMode();
        renderTasks();
    </script>
</body>
</html>
