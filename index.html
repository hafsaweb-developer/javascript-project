```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #333;
            text-align: center;
            padding: 30px 15px;
            margin: 0;
            transition: background 0.3s, color 0.3s;
        }

        h1 {
            color: #8b5e83;
        }

        input {
            padding: 12px;
            max-width: 100%;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            margin: 5px;
        }

        button {
            padding: 10px 14px;
            background: #8b5e83;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin: 4px;
        }

        button:hover {
            opacity: 0.8;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            background: white;
            color: #333;
            margin: 12px auto;
            padding: 15px;
            max-width: 550px;
            border-radius: 8px;
            box-shadow: 0 2px 5px #00000015;
        }

        .task-text {
            display: block;
            font-weight: bold;
            overflow-wrap: anywhere;
            margin-bottom: 8px;
        }

        .task-date {
            display: block;
            color: #777;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .status {
            display: inline-block;
            padding: 5px 9px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .today {
            background: #dff5e5;
            color: #176534;
        }

        .upcoming {
            background: #dceaff;
            color: #2455a4;
        }

        .overdue {
            background: #ffe1e1;
            color: #a51d1d;
        }

        .no-date {
            background: #eeeeee;
            color: #555;
        }

        .completed {
            background: #e5e5e5;
            color: #444;
        }

        #taskCount {
            font-weight: bold;
            color: #8b5e83;
        }

        .filters {
            margin: 20px 0;
        }

        .filter-button.active {
            background: #4d3150;
            outline: 2px solid #c99bc0;
        }

        body.dark-mode {
            background: #1e1e2f;
            color: #f5f5f5;
        }

        body.dark-mode h1,
        body.dark-mode #taskCount {
            color: #e6a8d7;
        }

        body.dark-mode li {
            background: #303047;
            color: #f5f5f5;
        }

        body.dark-mode .task-date {
            color: #d0c5d5;
        }

        body.dark-mode input {
            background: #303047;
            color: white;
            border-color: #666;
        }

        @media (max-width: 480px) {
            input {
                width: 100%;
                max-width: 320px;
            }
        }
    </style>
</head>

<body>
    <h1>My To-Do List</h1>

    <button id="darkModeButton" onclick="toggleDarkMode()">
        🌙 Dark Mode
    </button>

    <p>
        <input type="text" id="taskInput" placeholder="Enter a task">
        <input type="date" id="taskDate">
        <button onclick="addTask()">Add Task</button>
    </p>

    <div class="filters">
        <button class="filter-button active" data-filter="all"
            onclick="setFilter('all', this)">All Tasks</button>

        <button class="filter-button" data-filter="today"
            onclick="setFilter('today', this)">Today</button>

        <button class="filter-button" data-filter="upcoming"
            onclick="setFilter('upcoming', this)">Upcoming</button>

        <button class="filter-button" data-filter="overdue"
            onclick="setFilter('overdue', this)">Overdue</button>

        <button class="filter-button" data-filter="completed"
            onclick="setFilter('completed', this)">Completed</button>
    </div>

    <ul id="taskList"></ul>

    <p id="taskCount">Tasks: 0</p>

    <button onclick="clearTasks()">Clear All</button>

    <script>
        let currentFilter = "all";

        function getToday() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, "0");
            const day = String(now.getDate()).padStart(2, "0");

            return `${year}-${month}-${day}`;
        }

        function addTask() {
            const input = document.getElementById("taskInput");
            const dateInput = document.getElementById("taskDate");
            const task = input.value.trim();

            if (task === "") {
                alert("Please enter a task.");
                return;
            }

            createTask(task, dateInput.value, false);

            input.value = "";
            dateInput.value = "";

            saveTasks();
            updateTaskCount();
            applyFilter();
        }

        function createTask(task, taskDate, completed) {
            const listItem = document.createElement("li");
            listItem.dataset.date = taskDate || "";
            listItem.dataset.completed = String(Boolean(completed));

            const taskText = document.createElement("span");
            taskText.className = "task-text";
            taskText.textContent = task;

            const dateText = document.createElement("span");
            dateText.className = "task-date";

            const status = document.createElement("span");
            status.className = "status";

            function updateStatus() {
                const date = listItem.dataset.date;
                const isCompleted = listItem.dataset.completed === "true";

                status.className = "status";

                if (isCompleted) {
                    status.textContent = "Completed";
                    status.classList.add("completed");
                } else if (!date) {
                    status.textContent = "No date";
                    status.classList.add("no-date");
                } else if (date === getToday()) {
                    status.textContent = "Today";
                    status.classList.add("today");
                } else if (date < getToday()) {
                    status.textContent = "Overdue";
                    status.classList.add("overdue");
                } else {
                    status.textContent = "Upcoming";
                    status.classList.add("upcoming");
                }

                dateText.textContent = date ? "Due: " + date : "No date selected";
            }

            updateStatus();

            if (completed) {
                taskText.style.textDecoration = "line-through";
                taskText.style.opacity = "0.5";
            }

            const completeButton = document.createElement("button");
            completeButton.textContent = completed ? "Undo" : "Complete";

            completeButton.onclick = function() {
                const isCompleted = listItem.dataset.completed === "true";
                listItem.dataset.completed = String(!isCompleted);

                taskText.style.textDecoration = !isCompleted
                    ? "line-through" : "none";
                taskText.style.opacity = !isCompleted ? "0.5" : "1";
                completeButton.textContent = !isCompleted ? "Undo" : "Complete";

                updateStatus();
                saveTasks();
                updateTaskCount();
                applyFilter();
            };

            const editButton = document.createElement("button");
            editButton.textContent = "Edit";

            editButton.onclick = function() {
                const newTask = prompt("Edit your task:", taskText.textContent);

                if (newTask !== null && newTask.trim() !== "") {
                    taskText.textContent = newTask.trim();

                    const newDate = prompt(
                        "Enter a due date as YYYY-MM-DD, or leave blank for no date:",
                        listItem.dataset.date
                    );

                    if (newDate !== null) {
                        if (newDate === "" || /^\d{4}-\d{2}-\d{2}$/.test(newDate)) {
                            listItem.dataset.date = newDate;
                            updateStatus();
                        } else {
                            alert("Please use the date format YYYY-MM-DD.");
                        }
                    }

                    saveTasks();
                    applyFilter();
                }
            };

            const deleteButton = document.createElement("button");
            deleteButton.textContent = "Delete";

            deleteButton.onclick = function() {
                listItem.remove();
                saveTasks();
                updateTaskCount();
                applyFilter();
            };

            listItem.append(
                taskText,
                dateText,
                document.createElement("br"),
                status,
                document.createElement("br"),
                completeButton,
                editButton,
                deleteButton
            );

            document.getElementById("taskList").appendChild(listItem);
        }

        function saveTasks() {
            const tasks = [];

            document.querySelectorAll("#taskList li").forEach(function(item) {
                tasks.push({
                    text: item.querySelector(".task-text").textContent,
                    date: item.dataset.date || "",
                    completed: item.dataset.completed === "true"
                });
            });

            localStorage.setItem("tasks", JSON.stringify(tasks));
        }

        function loadTasks() {
            let savedTasks = [];

            try {
                savedTasks = JSON.parse(localStorage.getItem("tasks")) || [];
            } catch (error) {
                savedTasks = [];
            }

            savedTasks.forEach(function(task) {
                createTask(task.text, task.date || "", task.completed);
            });

            updateTaskCount();
            applyFilter();
        }

        function updateTaskCount() {
            const tasks = Array.from(document.querySelectorAll("#taskList li"));
            const activeTasks = tasks.filter(
                task => task.dataset.completed !== "true"
            ).length;

            document.getElementById("taskCount").textContent =
                `Tasks: ${tasks.length} | Remaining: ${activeTasks}`;
        }

        function setFilter(filter, button) {
            currentFilter = filter;

            document.querySelectorAll(".filter-button").forEach(function(item) {
                item.classList.remove("active");
            });

            button.classList.add("active");
            applyFilter();
        }

        function applyFilter() {
            document.querySelectorAll("#taskList li").forEach(function(item) {
                const date = item.dataset.date;
                const completed = item.dataset.completed === "true";
                let show = false;

                if (currentFilter === "all") {
                    show = true;
                } else if (currentFilter === "completed") {
                    show = completed;
                } else if (currentFilter === "today") {
                    show = !completed && date === getToday();
                } else if (currentFilter === "upcoming") {
                    show = !completed && date > getToday();
                } else if (currentFilter === "overdue") {
                    show = !completed && date !== "" && date < getToday();
                }

                item.style.display = show ? "" : "none";
            });
        }

        function clearTasks() {
            if (!confirm("Are you sure you want to delete all tasks?")) {
                return;
            }

            document.getElementById("taskList").innerHTML = "";
            localStorage.removeItem("tasks");

            updateTaskCount();
            applyFilter();
        }

        function toggleDarkMode() {
            const isDark = document.body.classList.toggle("dark-mode");

            document.getElementById("darkModeButton").textContent =
                isDark ? "☀️ Light Mode" : "🌙 Dark Mode";

            localStorage.setItem("darkMode", String(isDark));
        }

        function loadDarkMode() {
            const isDark = localStorage.getItem("darkMode") === "true";

            if (isDark) {
                document.body.classList.add("dark-mode");
                document.getElementById("darkModeButton").textContent =
                    "☀️ Light Mode";
            }
        }

        loadDarkMode();
        loadTasks();
    </script>
</body>
</html>
