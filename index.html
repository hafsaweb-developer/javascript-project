<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JavaScript To-Do List</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            text-align: center;
            padding: 50px;
        }

        h1 {
            color: #8b5e83;
            margin-bottom: 25px;
        }

        input {
            padding: 12px;
            width: 250px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            margin: 5px;
        }

        button {
            padding: 10px 20px;
            background: #333;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin: 5px;
        }

        button:hover {
            opacity: 0.8;
        }

        ul {
            list-style: none;
            padding: 0;
            margin-top: 25px;
        }

        li {
            background: white;
            margin: 10px auto;
            padding: 15px;
            max-width: 450px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .task-text {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .task-date {
            display: block;
            color: #777;
            margin-bottom: 8px;
            font-size: 14px;
        }

        #taskCount {
            font-weight: bold;
            color: #8b5e83;
        }
    </style>
</head>

<body>

    <h1>My To-Do List</h1>

    <input type="text" id="taskInput" placeholder="Enter a task">

    <input type="date" id="taskDate">

    <button onclick="addTask()">Add Task</button>

    <ul id="taskList"></ul>

    <p id="taskCount">Tasks: 0</p>

    <button onclick="clearTasks()">Clear All</button>

    <script>

        function addTask() {

            const input = document.getElementById("taskInput");
            const task = input.value.trim();

            const dateInput = document.getElementById("taskDate");
            const taskDate = dateInput.value;

            if (task === "") {
                alert("Please enter a task.");
                return;
            }

            createTask(task, taskDate, false);

            input.value = "";
            dateInput.value = "";

            saveTasks();

            updateTaskCount();
        }


        function createTask(task, taskDate, completed) {

            const listItem = document.createElement("li");

            const taskText = document.createElement("span");
            taskText.className = "task-text";
            taskText.textContent = task;

            if (completed) {
                taskText.style.textDecoration = "line-through";
                taskText.style.opacity = "0.5";
            }


            const dateText = document.createElement("span");
            dateText.className = "task-date";

            if (taskDate !== "") {
                dateText.textContent = "Due: " + taskDate;
            } else {
                dateText.textContent = "No date";
            }


            const completeButton = document.createElement("button");
            completeButton.textContent = "Complete";

            completeButton.onclick = function() {

                if (taskText.style.textDecoration === "line-through") {

                    taskText.style.textDecoration = "none";
                    taskText.style.opacity = "1";

                } else {

                    taskText.style.textDecoration = "line-through";
                    taskText.style.opacity = "0.5";
                }

                saveTasks();
            };


            const editButton = document.createElement("button");
            editButton.textContent = "Edit";

            editButton.onclick = function() {

                const newTask = prompt(
                    "Edit your task:",
                    taskText.textContent
                );

                if (newTask !== null && newTask.trim() !== "") {

                    taskText.textContent = newTask.trim();

                    saveTasks();
                }
            };


            const deleteButton = document.createElement("button");
            deleteButton.textContent = "Delete";

            deleteButton.onclick = function() {

                listItem.remove();

                saveTasks();

                updateTaskCount();
            };


            listItem.appendChild(taskText);
            listItem.appendChild(dateText);
            listItem.appendChild(completeButton);
            listItem.appendChild(editButton);
            listItem.appendChild(deleteButton);

            document.getElementById("taskList").appendChild(listItem);
        }


        function saveTasks() {

            const tasks = [];

            document.querySelectorAll("#taskList li").forEach(function(listItem) {

                const taskText = listItem.querySelector(".task-text");
                const dateText = listItem.querySelector(".task-date");

                let taskDate = "";

                if (dateText.textContent !== "No date") {
                    taskDate = dateText.textContent.replace("Due: ", "");
                }

                tasks.push({
                    text: taskText.textContent,
                    date: taskDate,
                    completed: taskText.style.textDecoration === "line-through"
                });

            });

            localStorage.setItem("tasks", JSON.stringify(tasks));
        }


        function loadTasks() {

            const savedTasks =
                JSON.parse(localStorage.getItem("tasks")) || [];

            savedTasks.forEach(function(task) {

                createTask(
                    task.text,
                    task.date || "",
                    task.completed
                );

            });

            updateTaskCount();
        }


        function updateTaskCount() {

            const count =
                document.querySelectorAll("#taskList li").length;

            document.getElementById("taskCount").textContent =
                "Tasks: " + count;
        }


        function clearTasks() {

            document.getElementById("taskList").innerHTML = "";

            localStorage.removeItem("tasks");

            updateTaskCount();
        }


        loadTasks();

    </script>

</body>

</html>
