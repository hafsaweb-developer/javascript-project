<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f3f4f8;
            color: #222;
            margin: 0;
            padding: 25px 15px;
            transition: 0.3s;
        }

        .container {
            max-width: 750px;
            margin: 0 auto;
            background: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            color: #6c4ab6;
            margin-top: 0;
        }

        .top-bar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 15px;
        }

        input, select, button {
            font: inherit;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            margin-bottom: 10px;
            background: white;
            color: #222;

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;

            border: none;

            padding: 11px 14px;

            font-weight: bold;
        }

        button:hover {
            opacity: 0.85;
        }

        .primary {
            background: #6c4ab6;
            color: white;
        }

        .secondary {
            background: #e8e0f7;
            color: #50328f;
        }

        .danger {
            background: #ffe0e0;

        .search-section {
            margin-top: 20px;

            background: #6c4ab6;

                padding: 17px;
            }

</head>

<body>
    <div class="container">
        <div class="top-bar">
            <button id="darkModeButton" class="secondary">
                🌙 Dark Mode
            </button>
        </div>

        <h1>📝 My To-Do List</h1>
        <p style="text-align:center;">Organize your day, one task at a time.</p>

        <form id="taskForm">
            <input
                type="text"
                id="taskInput"
                placeholder="Enter a task..."
                required
            >

            <div class="form-grid">
                <div>
                    <label for="dueDate">Due date</label>
                    <input type="date" id="dueDate">
                </div>

                <div>
                    <label for="priority">Priority</label>
                    <select id="priority">
                        <option value="Medium">Medium Priority</option>
                        <option value="High">High Priority</option>
                        <option value="Low">Low Priority</option>
                    </select>
                </div>
            </div>

            <button type="submit" id="addTaskButton" class="primary">
                ➕ Add Task
            </button>
            <button type="button" id="cancelEditButton" class="secondary" hidden>
                Cancel Edit
            </button>
        </form>

        <div class="search-section">
            <input
                type="search"
                id="searchInput"
                placeholder="🔍 Search your tasks..."
                aria-label="Search your tasks"
            >
        </div>

        <div class="filters">
            <button type="button" data-filter="all" class="active">All Tasks</button>
            <button type="button" data-filter="today">Today</button>
            <button type="button" data-filter="upcoming">Upcoming</button>
            <button type="button" data-filter="overdue">Overdue</button>
            <button type="button" data-filter="completed">Completed</button>
        </div>

        <div class="progress-section">
            <div class="progress-info">
                <strong id="taskCount">Tasks: 0 | Completed: 0</strong>
                <span id="progressText">0% completed</span>
            </div>

            <div
                class="progress-track"
                id="progressTrack"
                role="progressbar"
                aria-label="Task completion progress"
                aria-valuemin="0"
                aria-valuemax="100"
                aria-valuenow="0"
            >
                <div id="progressBar" class="progress-bar"></div>
            </div>
        </div>

        <div id="taskList"></div>

        <div class="clear-section">
            <button type="button" id="clearAllButton" class="danger">
                🗑️ Clear All Tasks
            </button>
        </div>
    </div>

    <script>
        const taskForm = document.getElementById("taskForm");
        const taskInput = document.getElementById("taskInput");
        const dueDateInput = document.getElementById("dueDate");
        const priorityInput = document.getElementById("priority");
        const addTaskButton = document.getElementById("addTaskButton");
        const cancelEditButton = document.getElementById("cancelEditButton");
        const searchInput = document.getElementById("searchInput");
        const taskList = document.getElementById("taskList");
        const taskCount = document.getElementById("taskCount");
        const progressText = document.getElementById("progressText");
        const progressBar = document.getElementById("progressBar");
        const progressTrack = document.getElementById("progressTrack");
        const darkModeButton = document.getElementById("darkModeButton");
        const clearAllButton = document.getElementById("clearAllButton");
        const filterButtons = document.querySelectorAll("[data-filter]");

        // Keep previously saved tasks.
        let tasks = [];

        try {
            const savedTasks = JSON.parse(localStorage.getItem("tasks") || "[]");

            if (Array.isArray(savedTasks)) {
                tasks = savedTasks.map((task, index) => {
                    // Support older versions that saved tasks as plain text.
                    if (typeof task === "string") {
                        return {
                            id: Date.now() + index,
                            text: task,
                            completed: false,
                            dueDate: "",
                            priority: "Medium"
                        };
                    }

                    return {
                        id: task.id ?? Date.now() + index,
                        text: String(task.text ?? task.name ?? ""),
                        completed: Boolean(task.completed),
                        dueDate: task.dueDate || "",
                        priority: ["High", "Medium", "Low"].includes(task.priority)
                            ? task.priority
                            : "Medium"
                    };
                });
            }
        } catch (error) {
            console.error("Could not read saved tasks:", error);
        }

        let currentFilter = "all";
        let editingTaskId = null;

        function saveTasks() {
            localStorage.setItem("tasks", JSON.stringify(tasks));
        }

        function getToday() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, "0");
            const day = String(now.getDate()).padStart(2, "0");

            return `${year}-${month}-${day}`;
        }

        function getVisibleTasks() {
            const today = getToday();
            const searchTerm = searchInput.value.trim().toLowerCase();

            return tasks.filter(task => {
                // SEARCH: Only show tasks whose text matches the search.
                const matchesSearch = task.text
                    .toLowerCase()
                    .includes(searchTerm);

                if (!matchesSearch) {
                    return false;
                }

                // FILTER: Apply the selected task category.
                if (currentFilter === "completed") {
                    return task.completed;
                }

                if (currentFilter === "today") {
                    return !task.completed && task.dueDate === today;
                }

                if (currentFilter === "upcoming") {
                    return !task.completed &&
                        task.dueDate !== "" &&
                        task.dueDate > today;
                }

                if (currentFilter === "overdue") {
                    return !task.completed &&
                        task.dueDate !== "" &&
                        task.dueDate < today;
                }

                return true;
            });
        }

        function renderTasks() {
            taskList.innerHTML = "";

            const visibleTasks = getVisibleTasks();

            if (visibleTasks.length === 0) {
                const message = document.createElement("p");
                message.className = "empty-message";
                message.textContent = searchInput.value.trim()
                    ? "No tasks match your search."
                    : "No tasks to show here yet.";
                taskList.appendChild(message);
            }

            visibleTasks.forEach(task => {
                const taskElement = document.createElement("div");
                taskElement.className = "task" +
                    (task.completed ? " completed" : "");

                const checkbox = document.createElement("input");
                checkbox.type = "checkbox";
                checkbox.className = "task-checkbox";
                checkbox.checked = task.completed;
                checkbox.setAttribute("aria-label", "Mark task completed");

                checkbox.addEventListener("change", () => {
                    task.completed = checkbox.checked;
                    saveTasks();
                    renderTasks();
                });

                const content = document.createElement("div");
                content.className = "task-content";

                const title = document.createElement("div");
                title.className = "task-title";
                title.textContent = task.text;

                const meta = document.createElement("div");
                meta.className = "task-meta";
                meta.textContent = task.dueDate
                    ? "Due: " + task.dueDate
                    : "No due date";

                const priority = document.createElement("span");
                priority.className = "priority " + task.priority;
                priority.textContent = task.priority + " Priority";

                content.appendChild(title);
                content.appendChild(meta);
                content.appendChild(priority);

                const actions = document.createElement("div");
                actions.className = "task-actions";

                const editButton = document.createElement("button");
                editButton.type = "button";
                editButton.className = "secondary";
                editButton.textContent = "✏️ Edit";

                editButton.addEventListener("click", () => {
                    taskInput.value = task.text;
                    dueDateInput.value = task.dueDate;
                    priorityInput.value = task.priority;
                    editingTaskId = task.id;
                    addTaskButton.textContent = "💾 Save Changes";
                    cancelEditButton.hidden = false;
                    taskInput.focus();
                    window.scrollTo({ top: 0, behavior: "smooth" });
                });

                const deleteButton = document.createElement("button");
                deleteButton.type = "button";
                deleteButton.className = "danger";
                deleteButton.textContent = "🗑️ Delete";

                deleteButton.addEventListener("click", () => {
                    tasks = tasks.filter(item => item.id !== task.id);

                    if (editingTaskId === task.id) {
                        cancelEditing();
                    }

                    saveTasks();
                    renderTasks();
                });

                actions.appendChild(editButton);
                actions.appendChild(deleteButton);

                taskElement.appendChild(checkbox);
                taskElement.appendChild(content);
                taskElement.appendChild(actions);

                taskList.appendChild(taskElement);
            });

            // Progress always counts all tasks, not just search results.
            const completedTasks = tasks.filter(task => task.completed).length;
            const percentage = tasks.length === 0
                ? 0
                : Math.round((completedTasks / tasks.length) * 100);

            taskCount.textContent =
                "Tasks: " + tasks.length +
                " | Completed: " + completedTasks;

            progressText.textContent = percentage + "% completed";
            progressBar.style.width = percentage + "%";
            progressTrack.setAttribute("aria-valuenow", percentage);
        }

        function cancelEditing() {
            editingTaskId = null;
            taskForm.reset();
            addTaskButton.textContent = "➕ Add Task";
            cancelEditButton.hidden = true;
        }

        taskForm.addEventListener("submit", event => {
            event.preventDefault();

            const text = taskInput.value.trim();

            if (!text) {
                return;
            }

            if (editingTaskId !== null) {
                const task = tasks.find(item => item.id === editingTaskId);

                if (task) {
                    task.text = text;
                    task.dueDate = dueDateInput.value;
                    task.priority = priorityInput.value;
                }

                cancelEditing();
            } else {
                tasks.push({
                    id: Date.now(),
                    text: text,
                    completed: false,
                    dueDate: dueDateInput.value,
                    priority: priorityInput.value
                });

                taskForm.reset();
            }

            saveTasks();
            renderTasks();
        });

        cancelEditButton.addEventListener("click", cancelEditing);

        // Search again every time the user types or deletes a character.
        searchInput.addEventListener("input", () => {
            renderTasks();
        });

        filterButtons.forEach(button => {
            button.addEventListener("click", () => {
                currentFilter = button.dataset.filter;

                filterButtons.forEach(item => {
                    item.classList.toggle("active", item === button);
                });

                renderTasks();
            });
        });

        darkModeButton.addEventListener("click", () => {
            document.body.classList.toggle("dark");

            const darkModeOn = document.body.classList.contains("dark");
            darkModeButton.textContent = darkModeOn
                ? "☀️ Light Mode"
                : "🌙 Dark Mode";

            localStorage.setItem("darkMode", darkModeOn ? "on" : "off");
        });

        if (localStorage.getItem("darkMode") === "on") {
            document.body.classList.add("dark");
            darkModeButton.textContent = "☀️ Light Mode";
        }

        clearAllButton.addEventListener("click", () => {
            if (tasks.length === 0) {
                return;
            }

            const confirmed = confirm(
                "Are you sure you want to delete ALL your tasks? This cannot be undone."
            );

            if (confirmed) {
                tasks = [];
                cancelEditing();
                saveTasks();
                renderTasks();
            }
        });

        // Display saved tasks when the page opens.
        renderTasks();
    </script>
</body>
</html>
