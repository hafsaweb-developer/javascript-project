<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f3f4f6;
            color: #222;
            margin: 0;
            padding: 30px 15px;
            transition: background 0.3s, color 0.3s;
        }

        .container {
            max-width: 850px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-top: 0;
        }

        .top-bar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 20px;
        }

        input, select, button {
            font: inherit;
            padding: 11px;
            border-radius: 7px;
            border: 1px solid #ccc;
        }

        input, select {
            max-width: 100%;
        }

        .add-area {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;

            flex: 2 1 200px;

        #taskDate, #taskPriority {

        button {
            border: none;
            cursor: pointer;
            background: #2563eb;
            color: white;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.85;
        }

        .theme-button {
            background: #374151;
        }

        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 20px 0;
        }

        .filter-button {
            background: #e5e7eb;
            color: #222;
        }

        .filter-button.active {
            background: #2563eb;
            color: white;
        }

        #taskList {
            list-style: none;
            padding: 0;
            margin: 0;

        .task-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding: 15px;
            margin-bottom: 12px;

            border-radius: 10px;
            overflow-wrap: anywhere;
        }

        .task-info {
            flex: 1;
            min-width: 0;

        .task-name {
            font-weight: bold;

        .task-meta {
            margin-top: 8px;

        .completed .task-name {
            text-decoration: line-through;

        .priority {

                padding: 15px 8px;

    </style>
</head>

<body>

<div class="container">

    <h1>My To-Do List</h1>

    <div class="top-bar">
        <button class="theme-button" id="themeButton"
                onclick="toggleDarkMode()">
            🌙 Dark Mode
        </button>
    </div>

    <!-- ADD TASK AREA -->

    <div class="add-area">
        <input
            type="text"
            id="taskInput"
            placeholder="Enter a task"
        >

        <input
            type="date"
            id="taskDate"
            aria-label="Task due date"
        >

        <select id="taskPriority" aria-label="Task priority">
            <option value="High">🔴 High Priority</option>
            <option value="Medium" selected>🟠 Medium Priority</option>
            <option value="Low">🟢 Low Priority</option>
        </select>

        <button onclick="addTask()">Add Task</button>
    </div>

    <!-- TASK FILTERS -->

    <div class="filters">
        <button class="filter-button active"
                data-filter="all"
                onclick="setFilter('all', this)">
            All Tasks
        </button>

        <button class="filter-button"
                data-filter="today"
                onclick="setFilter('today', this)">
            Today
        </button>

        <button class="filter-button"
                data-filter="upcoming"
                onclick="setFilter('upcoming', this)">
            Upcoming
        </button>

        <button class="filter-button"
                data-filter="overdue"
                onclick="setFilter('overdue', this)">
            Overdue
        </button>

        <button class="filter-button"
                data-filter="completed"
                onclick="setFilter('completed', this)">
            Completed
        </button>
    </div>

    <!-- TASK LIST -->

    <ul id="taskList"></ul>

    <div class="summary">
        <strong id="taskCount">Tasks: 0</strong>

        <button class="clear-button" onclick="clearAllTasks()">
            Clear All
        </button>
    </div>

</div>

<script>
    // LOAD SAVED TASKS

    let tasks = [];

    try {
        const savedTasks = JSON.parse(
            localStorage.getItem("tasks") || "[]"
        );

        if (Array.isArray(savedTasks)) {
            tasks = savedTasks.map((task, index) => ({
                id: task.id ?? (Date.now() + index),
                text: task.text ?? task.task ?? task.name ?? "",
                date: task.date ?? task.dueDate ?? "",
                completed: Boolean(
                    task.completed ?? task.isCompleted ?? false
                ),
                priority: ["High", "Medium", "Low"].includes(task.priority)
                    ? task.priority
                    : "Medium"
            }));
        }
    } catch (error) {
        tasks = [];
    }

    let currentFilter = "all";


    // SAVE TASKS

    function saveTasks() {
        localStorage.setItem("tasks", JSON.stringify(tasks));
    }


    // GET TODAY'S DATE IN LOCAL TIME

    function getToday() {
        const today = new Date();

        const year = today.getFullYear();
        const month = String(today.getMonth() + 1).padStart(2, "0");
        const day = String(today.getDate()).padStart(2, "0");

        return `${year}-${month}-${day}`;
    }


    // ADD TASK

    function addTask() {
        const taskInput = document.getElementById("taskInput");
        const taskDate = document.getElementById("taskDate");
        const taskPriority = document.getElementById("taskPriority");

        const text = taskInput.value.trim();
        const date = taskDate.value;
        const priority = taskPriority.value;

        if (text === "") {
            alert("Please enter a task!");
            taskInput.focus();
            return;
        }

        tasks.push({
            id: Date.now(),
            text: text,
            date: date,
            priority: priority,
            completed: false
        });

        saveTasks();

        taskInput.value = "";
        taskDate.value = "";
        taskPriority.value = "Medium";

        renderTasks();
    }


    // COMPLETE OR UNCOMPLETE A TASK

    function toggleComplete(id) {
        const task = tasks.find(task => task.id === id);

        if (!task) return;

        task.completed = !task.completed;

        saveTasks();
        renderTasks();
    }


    // EDIT TASK

    function editTask(id) {
        const task = tasks.find(task => task.id === id);

        if (!task) return;

        const newText = prompt("Edit your task:", task.text);

        if (newText === null) return;

        if (newText.trim() === "") {
            alert("Task cannot be empty!");
            return;
        }

        const newDate = prompt(
            "Enter a due date in YYYY-MM-DD format, or leave blank:",
            task.date || ""
        );

        if (newDate === null) return;

        if (newDate.trim() !== "" &&
            !/^\d{4}-\d{2}-\d{2}$/.test(newDate.trim())) {
            alert("Please use the date format YYYY-MM-DD.");
            return;
        }

        const newPriority = prompt(
            "Choose priority: High, Medium, or Low",
            task.priority
        );

        if (newPriority === null) return;

        const priority = newPriority.trim().toLowerCase();

        const priorityMap = {
            high: "High",
            medium: "Medium",
            low: "Low"
        };

        if (!priorityMap[priority]) {
            alert("Please enter High, Medium, or Low.");
            return;
        }

        task.text = newText.trim();
        task.date = newDate.trim();
        task.priority = priorityMap[priority];

        saveTasks();
        renderTasks();
    }


    // DELETE ONE TASK

    function deleteTask(id) {
        if (!confirm("Are you sure you want to delete this task?")) {
            return;
        }

        tasks = tasks.filter(task => task.id !== id);

        saveTasks();
        renderTasks();
    }


    // CLEAR ALL TASKS

    function clearAllTasks() {
        if (tasks.length === 0) {
            alert("There are no tasks to clear.");
            return;
        }

        if (!confirm("Are you sure you want to delete all tasks?")) {
            return;
        }

        tasks = [];

        saveTasks();
        renderTasks();
    }


    // FILTER TASKS

    function setFilter(filter, button) {
        currentFilter = filter;

        document.querySelectorAll(".filter-button").forEach(btn => {
            btn.classList.remove("active");
        });

        button.classList.add("active");

        renderTasks();
    }


    // CHECK WHICH TASKS SHOULD BE DISPLAYED

    function matchesFilter(task) {
        const today = getToday();

        if (currentFilter === "all") {
            return true;
        }

        if (currentFilter === "completed") {
            return task.completed;
        }

        if (task.completed) {
            return false;
        }

        if (currentFilter === "today") {
            return task.date === today;
        }

        if (currentFilter === "upcoming") {
            return task.date !== "" && task.date > today;
        }

        if (currentFilter === "overdue") {
            return task.date !== "" && task.date < today;
        }

        return true;
    }


    // DISPLAY TASKS

    function renderTasks() {
        const taskList = document.getElementById("taskList");
        const taskCount = document.getElementById("taskCount");

        taskList.innerHTML = "";

        const visibleTasks = tasks.filter(matchesFilter);

        if (visibleTasks.length === 0) {
            const emptyMessage = document.createElement("li");
            emptyMessage.className = "empty-message";
            emptyMessage.textContent = "No tasks found.";
            taskList.appendChild(emptyMessage);
        }

        visibleTasks.forEach(task => {
            const li = document.createElement("li");

            li.className = "task-item";

            if (task.completed) {
                li.classList.add("completed");
            }

            const info = document.createElement("div");
            info.className = "task-info";

            const name = document.createElement("div");
            name.className = "task-name";
            name.textContent = task.text;

            const meta = document.createElement("div");
            meta.className = "task-meta";
            meta.textContent = task.date
                ? "Due: " + task.date
                : "No due date";

            const priority = document.createElement("span");
            priority.className = "priority priority-" + task.priority;
            priority.textContent = task.priority + " Priority";

            info.appendChild(name);
            info.appendChild(meta);
            info.appendChild(priority);

            const actions = document.createElement("div");
            actions.className = "task-actions";

            const completeButton = document.createElement("button");
            completeButton.className = "complete-button";
            completeButton.textContent = task.completed
                ? "Undo"
                : "Complete";
            completeButton.onclick = () => toggleComplete(task.id);

            const editButton = document.createElement("button");
            editButton.className = "edit-button";
            editButton.textContent = "Edit";
            editButton.onclick = () => editTask(task.id);

            const deleteButton = document.createElement("button");
            deleteButton.className = "delete-button";
            deleteButton.textContent = "Delete";
            deleteButton.onclick = () => deleteTask(task.id);

            actions.appendChild(completeButton);
            actions.appendChild(editButton);
            actions.appendChild(deleteButton);

            li.appendChild(info);
            li.appendChild(actions);

            taskList.appendChild(li);
        });

        taskCount.textContent =
            "Tasks: " + tasks.length +
            " | Completed: " +
            tasks.filter(task => task.completed).length;
    }


    // DARK MODE

    function toggleDarkMode() {
        document.body.classList.toggle("dark-mode");

        const isDark = document.body.classList.contains("dark-mode");

        localStorage.setItem("darkMode", isDark ? "on" : "off");

        updateThemeButton();
    }


    // UPDATE DARK MODE BUTTON TEXT

    function updateThemeButton() {
        const button = document.getElementById("themeButton");

        if (document.body.classList.contains("dark-mode")) {
            button.textContent = "☀️ Light Mode";
        } else {
            button.textContent = "🌙 Dark Mode";
        }
    }


    // RESTORE DARK MODE

    if (localStorage.getItem("darkMode") === "on") {
        document.body.classList.add("dark-mode");
    }

    updateThemeButton();


    // ALLOW ENTER KEY TO ADD TASK

    document.getElementById("taskInput").addEventListener(
        "keydown",
        function(event) {
            if (event.key === "Enter") {
                addTask();
            }
        }
    );


    // SHOW SAVED TASKS WHEN PAGE OPENS

    renderTasks();
</script>

</body>
</html>
