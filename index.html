<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JavaScript To-Do List</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            text-align: center;
            padding: 50px;
        }

        h1 {
            color: #8b5e83;
            margin-bottom: 25px;
        }

        input {
            padding: 12px;
            width: 250px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            padding: 10px 20px;
            background: #333;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin: 5px;
        }

        button:hover {
            opacity: 0.8;
        }

        ul {
            list-style: none;
            padding: 0;
            margin-top: 25px;
        }

        li {
            background: white;
            margin: 10px auto;
            padding: 15px;
            max-width: 350px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>

<body>

    <h1>My To-Do List</h1>

    <input type="text" id="taskInput" placeholder="Enter a task">

    <button onclick="addTask()">Add Task</button>

    <ul id="taskList"></ul>
    <p id="taskCount">Tasks: 0</p>

    <button onclick="clearTasks()">Clear All</button>

    <script>

        function addTask() {

            const input = document.getElementById("taskInput");
            const task = input.value;

            if (task === "") {
                alert("Please enter a task.");
                return;
            }

            const listItem = document.createElement("li");

            const taskText = document.createElement("span");
            taskText.textContent = task;

            const completeButton = document.createElement("button");
            completeButton.textContent = "Complete";

            completeButton.onclick = function() {

                if (taskText.style.textDecoration === "line-through") {
                    taskText.style.textDecoration = "none";
                    taskText.style.opacity = "1";
                } else {
                    taskText.style.textDecoration = "line-through";
                    taskText.style.opacity = "0.5";
                }

                saveTasks();
            };

            const deleteButton = document.createElement("button");
            deleteButton.textContent = "Delete";

            deleteButton.onclick = function() {

                listItem.remove();

                saveTasks();
            };

            listItem.appendChild(taskText);
            listItem.appendChild(completeButton);
            listItem.appendChild(deleteButton);

            document.getElementById("taskList").appendChild(listItem);

            input.value = "";

            saveTasks();
        }


        function saveTasks() {

            const tasks = [];

            document.querySelectorAll("#taskList li").forEach(function(listItem) {

                const taskText = listItem.querySelector("span").textContent;

                const completed =
                    listItem.querySelector("span").style.textDecoration === "line-through";

                tasks.push({
                    text: taskText,
                    completed: completed
                });

            });

            localStorage.setItem("tasks", JSON.stringify(tasks));
        }


        function loadTasks() {

            const savedTasks =
                JSON.parse(localStorage.getItem("tasks")) || [];

            savedTasks.forEach(function(task) {

                const listItem = document.createElement("li");

                const taskText = document.createElement("span");
                taskText.textContent = task.text;

                if (task.completed) {
                    taskText.style.textDecoration = "line-through";
                    taskText.style.opacity = "0.5";
                }

                const completeButton = document.createElement("button");
                completeButton.textContent = "Complete";

                completeButton.onclick = function() {

                    if (taskText.style.textDecoration === "line-through") {
                        taskText.style.textDecoration = "none";
                        taskText.style.opacity = "1";
                    } else {
                        taskText.style.textDecoration = "line-through";
                        taskText.style.opacity = "0.5";
                    }

                    saveTasks();
                };

                const deleteButton = document.createElement("button");
                deleteButton.textContent = "Delete";

                deleteButton.onclick = function() {

                    listItem.remove();

                    saveTasks();
                };

                listItem.appendChild(taskText);
                listItem.appendChild(completeButton);
                listItem.appendChild(deleteButton);

                document.getElementById("taskList").appendChild(listItem);

            });
        }


        function clearTasks() {

            document.getElementById("taskList").innerHTML = "";

            localStorage.removeItem("tasks");
        }


        loadTasks();

    </script>

</body>

</html>
